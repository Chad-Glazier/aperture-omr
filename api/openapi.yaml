openapi: 3.0.3

info:
  title: OMR Service
  version: "0.0.1"
  description: |
    A service to perform Optical Mark Recognition (OMR) on scans of bubblesheets.

servers:
  - url: http://localhost:3000/

tags:
  - name: Health
    description: Service health and availability
  - name: Scan
    description: Image scans of exams
  - name: Preprocessing
    description: Data for preprocessing scans

paths:
  /template/preprocess:
    post:
      tags:
        - Preprocessing
      requestBody:
        description: |
          The body defines a preprocessing template in a `multipart/form-data`
          format. The `template` field is a JSON-encoded string, and the 
          image fields are expected to be in `image/tiff` encoding.

          Each page has exactly three anchors. The anchor `pageXanchorY` 
          corresponds to `template.pages[X].anchors[Y]`. Naturally, you 
          will need three anchors for each page. However, in the special 
          case that you have multiple pages and only three anchors, it 
          will be assumed that the anchors are the same for each page.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - template
                - page0anchor0
                - page0anchor1
                - page0anchor2
              properties:
                template:
                  $ref: "#/components/schemas/PreprocessingTemplate"
                page0anchor0:
                  type: string
                  format: binary
                page0anchor1:
                  type: string
                  format: binary
                page0anchor2:
                  type: string
                  format: binary
            encoding:
              template:
                contentType: application/json
              page0anchor0:
                contentType: image/tiff
              page0anchor1:
                contentType: image/tiff
              page0anchor2:
                contentType: image/tiff
      responses:
        200:
          description: |
            The preprocessing template was uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - templateId
                properties:
                  templateId:
                    description: |
                      The ID of the newly-created preprocessing template.
                    type: string
        400:
          description: |
            The request was missing something. Check the error message for 
            details.
          content:
            text/plain:
              schema:
                type: string
                description: |
                  A description of the error.
        500:
          description: |
            Something went wrong on the OMR's side. Check the OMR's logs and
            the error message for details.
          content:
            text/plain:
              schema: 
                type: string
                description: |
                  A description of the error.
                

components:
  schemas:
    Point:
      description: |
        Defines a point in the coordinates of a transformed image scan.
      required:
        - x
        - y
      properties:
        x:
          type: integer
        y:
          type: integer
    ROI:
      description: |
        Defines a region of interest; that is, a rectangle.
      required:
        - min
        - max
      properties:
        min: 
          $ref: "#/components/schemas/Point"
        max:
          $ref: "#/components/schemas/Point"
    PreprocessingConfig:
      description: |
        The configuration for the preprocessing of an image.
      type: object
      required:
        - blurSize
        - morphCloseSize
        - minAnchorConfidence
      properties:
        blurSize:
          type: integer
          example: 5
          description: |
            Gaussian blur kernel size, **must be odd**. Increase for noisier scans.
        morphCloseSize:
          type: integer
          example: 3
          description: |
            Morphological close kernel size. Helps fill gaps in pencil marks.
        minAnchorConfidence:
          type: number
          example: 0.5
          description: |
            Minimum template-match score (0.0-1.0). Raise if anchors produce false positives.
    PreprocessingPage:
      description: |
        Defines the anchors for a pages.
      type: object
      required:
        - anchors
      properties:
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/PreprocessingAnchor"
          description: |
            The data for the three anchors of a preprocessing template page.
    PreprocessingAnchor:
      description: |
        Describes information about an anchor.
      type: object
      required:
        - center
        - roi
      properties:
        center:
          description: |
            Where the center of this anchor should be in output space.
          $ref: "#/components/schemas/Point"
        roi:
          description: |
            The region of interest (ROI) for the anchor in output space. That is, the location of its top-left and bottom-right corners.
          $ref: "#/components/schemas/ROI"
    PreprocessingTemplate:
      description: |
        Represents the template used for preprocessing an image scan.
      type: object
      required:
        - width
        - height
        - config
        - pages
      properties:
        width:
          type: integer
          example: 800
          description: |
            The desired width of the image after preprocessing. Shared across all pages.
        height:
          type: integer
          example: 1700
          description: |
            The desired height of the image after preprocessing. Shared across all pages.
        config:
          $ref: "#/components/schemas/PreprocessingConfig"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PreprocessingPage"
