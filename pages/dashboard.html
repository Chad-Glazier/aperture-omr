<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OMR | System Monitoring</title>

    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
    <link rel="manifest" href="img/icons/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <script defer src="js/dashboard.js"></script>

    <h1>System Utilization</h1>

    <div id="updated"></div>
    <div id="error" class="error"></div>

    <div class="grid">

        <div class="card">
            <h2>CPU</h2>

            <div class="bar">
                <div id="cpu-bar"></div>
            </div>

            <div class="metric">
                <span class="label">Overall</span>
                <span class="value" id="cpu-overall"></span>
            </div>

            <div class="metric">
                <span class="label">CPU</span>
                <span class="value" id="cpu-description"></span>
            </div>

            <div class="metric">
                <span class="label">Frequency</span>
                <span class="value" id="cpu-mhz"></span>
            </div>
        </div>


        <div class="card">
            <h2>Memory</h2>

            <div class="bar">
                <div id="memory-bar"></div>
            </div>

            <div class="metric">
                <span class="label">OMR Process</span>
                <span class="value" id="memory-omr"></span>
            </div>

            <div class="metric">
                <span class="label">Other</span>
                <span class="value" id="memory-other"></span>
            </div>

            <div class="metric">
                <span class="label">Available</span>
                <span class="value" id="memory-available"></span>
            </div>

            <div class="metric">
                <span class="label">Used</span>
                <span class="value" id="memory-used"></span>
            </div>
        </div>


        <div class="card">
            <h2>Disk</h2>

            <div class="bar">
                <div id="disk-bar"></div>
            </div>

            <div class="metric">
                <span class="label">Used</span>
                <span class="value" id="disk-used"></span>
            </div>

            <div class="metric">
                <span class="label">Total</span>
                <span class="value" id="disk-total"></span>
            </div>

            <div class="metric">
                <span class="label">Database</span>
                <span class="value" id="disk-db"></span>
            </div>

            <div class="metric">
                <span class="label">Matrices</span>
                <span class="value" id="disk-matrices"></span>
            </div>

            <div class="metric">
                <span class="label">Pictures</span>
                <span class="value" id="disk-pictures"></span>
            </div>

            <div class="metric">
                <span class="label">Matrix Count</span>
                <span class="value" id="matrix-count"></span>
            </div>

            <div class="metric">
                <span class="label">Picture Count</span>
                <span class="value" id="picture-count"></span>
            </div>
        </div>
    </div>
</body>

</html>
